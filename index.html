  .field-note{font-size:14px;color:var(--ink-soft);margin:12px 0 22px;}

  .mirror-answer{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5;}

  .block{margin-bottom:26px;}
  .block h3{font-family:var(--serif);font-size:19px;font-weight:500;margin-bottom:12px;}
  .block h3 span{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-top:5px;}
  .block p{font-size:15.5px;line-height:1.65;margin-bottom:12px;}
  .block p:last-child{margin-bottom:0;}

  .hint{font-size:14px;line-height:1.6;color:var(--ink-soft);margin-top:14px;}
  .rule{height:1px;background:var(--line);margin:34px 0;}

  .group-card .fineprint{font-size:13px;color:#BFCFC6;margin-top:12px;margin-bottom:0;}
  .restart{display:block;margin:26px auto 0;background:none;border:none;font-family:var(--sans);

"hBridge": "Почему это почти невозможно поменять в одиночку",
"hint": "Что-то из этого не про вас, но что-то точно кольнуло.",
"bridge": [
"Ваш способ включается быстрее, чем вы успеваете его заметить. К тому моменту, когда становится понятно, что произошло, разговор уже прошёл, и остаётся разбирать его задним числом в разговорах сама с собой или, в лучшем случае, с подругой.",
"А обратной связи вы почти никогда не получаете. Никто не говорит вам: слушай, ты сейчас со мной согласилась, но тебя тут больше нет. Люди просто реже приносят вам сложное, тише уходят и перестают спрашивать ваше мнение. Вы получаете последствия и не получаете механизм. Отсюда и берётся знакомое ощущение, что везде повторяется одно и то же, а почему непонятно.",
"Механизм становится виден только там, где кто-то говорит вслух, что сейчас произошло между вами. Не на прошлой неделе, а вот прямо сейчас, в эту минуту. Именно в этом огромная ценность терапевтических групп."
],
"restart": "Пройти ещё раз",
"gEyebrow": "Терапевтическая онлайн-группа",
"gTitle": "«Между нами»",
"gP1": [
"Восемь участниц, двенадцать встреч, два ко-терапевта. Работаем не с рассказами о прошлой неделе, а с тем, что происходит между нами прямо сейчас. Это единственное место, где ваш механизм можно рассмотреть в моменте, ведь прямо сейчас он определяет, что вы скажете на встрече, а что проглотите, и какой проект вы не запустите в этом году."
],
"gP2": [
"С этим механизмом невозможно ничего сделать в одиночку. Понять его вы можете и сами, а вот попробовать другой способ возможно только рядом с другим человеком, который ответит вам честно, а не так, как вам удобно. Для этого и нужна группа: сказать вслух то, что обычно оставляете при себе и услышать, как это было для другого.",
"А чтобы такая честность не ранила, рядом есть терапевты. Наша работа - остановить в нужный момент, помочь рассмотреть, что сейчас между вами произошло, и попробовать иначе там, где обычно вы сбегаете."
],
"gFacts": "12 встреч · 8 участниц · два ведущих · перед стартом короткое вводное интервью",
"gBtn": "Попасть в лист предзаписи",
"gFine": "Предзапись ни к чему не обязывает. Когда откроется набор, я напишу вам в порядке очереди, и у вас будет время решить."
}
};
const T=CFG.T, OPTIONS=CFG.OPTIONS, SPHERES=CFG.SPHERES, PATTERNS=CFG.PATTERNS;
let step=0, pattern=null, sphere=null;
const app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function ps(arr,cls){return arr.map(function(x){return '<p'+(cls?' class="'+cls+'"':'')+'>'+esc(x)+'</p>';}).join("");}
function progress(n){return '<div class="progress"><span class="progress-label">Шаг '+n+' из 2</span>'+
  '<div class="progress-track"><div class="progress-fill" style="width:'+(n*50)+'%"></div></div></div>';}
function render(){ if(step===0) intro(); else if(step===1) question(); else if(step===2) sphereScreen(); else result(); }

function intro(){
  app.innerHTML =
    '<div class="eyebrow">'+esc(T.s1eyebrow)+'</div>'+
    '<h1 class="s1title">'+esc(T.s1title)+'</h1>'+
    ps(T.s1lead,'lead')+
    '<button class="btn" id="go" style="margin-top:12px">'+esc(T.s1btn)+'</button>';
  document.getElementById("go").onclick=function(){step=1;render();};
}
function question(){
  app.innerHTML = progress(1)+
    '<div class="scene">'+esc(T.scene)+'</div>'+
    '<div class="q-title">'+esc(T.question)+'</div>'+
    '<div class="options">'+OPTIONS.map(function(o,i){return '<button class="option" data-i="'+i+'">'+esc(o)+'</button>';}).join("")+'</div>';
  Array.prototype.forEach.call(app.querySelectorAll(".option"),function(b){
    b.onclick=function(){pattern=+b.dataset.i;step=2;render();window.scrollTo(0,0);};});
}
function sphereScreen(){
  var groups=SPHERES.map(function(g){return '<optgroup label="'+esc(g[0])+'">'+
    g[1].map(function(s){return '<option value="'+s[1]+'|'+esc(s[0])+'">'+esc(s[0])+'</option>';}).join("")+'</optgroup>';}).join("");
  app.innerHTML = progress(2)+
    '<label class="field" for="sph">'+esc(T.s3label)+'</label>'+
    '<select id="sph"><option value="">'+esc(T.s3ph)+'</option>'+groups+'</select>'+
    '<div style="height:22px"></div>'+
    '<button class="btn" id="show" disabled>'+esc(T.s3btn)+'</button>'+
    '<button class="back" id="back">Назад</button>';
  var sel=document.getElementById("sph"), btn=document.getElementById("show");
  sel.onchange=function(){btn.disabled=!sel.value;};
  btn.onclick=function(){ if(!sel.value) return; var p=sel.value.split("|");
    sphere={key:p[0],label:p[1]}; step=3; render(); window.scrollTo(0,0); };
  document.getElementById("back").onclick=function(){step=1;render();window.scrollTo(0,0);};
}
function result(){
  var p=PATTERNS[pattern];
  var signs=p.common.concat(p.work[sphere.key]);
  app.innerHTML =
    '<div class="eyebrow">'+esc(T.reyebrow)+'</div>'+
    '<h1>'+esc(p.name)+'</h1>'+
    '<div class="mirror"><div class="mirror-theme">'+esc(T.mirror)+'</div>'+
      '<div class="mirror-answer">'+esc(OPTIONS[pattern])+'</div></div>'+
    '<div class="block"><h3>'+esc(T.hInside)+'</h3><p>'+esc(p.inside)+'</p></div>'+
    '<div class="selftalk"><div class="cap">'+esc(T.hSelf)+'</div>'+
      p.selftalk.map(function(x){return '<div class="line">'+esc(x)+'</div>';}).join("")+'</div>'+
    '<div class="block"><h3>'+esc(T.hSigns)+'<span>'+esc(sphere.label)+'</span></h3>'+
      '<ul class="signs">'+signs.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>'+
      '<p class="hint">'+esc(T.hint)+'</p></div>'+
    '<div class="rule"></div>'+
    '<div class="block"><h3>'+esc(T.hGave)+'</h3><p>'+esc(p.gave)+'</p></div>'+
    '<div class="block"><h3>'+esc(T.hCost)+'</h3><p>'+esc(p.cost)+'</p></div>'+
    '<div class="block"><h3>'+esc(T.hTask)+'</h3><p>'+esc(p.task)+'</p></div>'+
    '<div class="rule"></div>'+
    '<div class="block"><h3>'+esc(T.hBridge)+'</h3>'+ps(T.bridge)+'</div>'+
    '<div class="group-card">'+
      '<div class="eyebrow">'+esc(T.gEyebrow)+'</div>'+
      '<h2>'+esc(T.gTitle)+'</h2>'+
      ps(T.gP1)+ps(T.gP2)+
      '<p class="facts">'+esc(T.gFacts)+'</p>'+
      '<a class="btn" href="'+CFG.LINK+'" target="_blank" rel="noopener">'+esc(T.gBtn)+'</a>'+
      '<p class="fineprint">'+esc(T.gFine)+'</p>'+
    '</div>'+
    '<button class="restart" id="again">'+esc(T.restart)+'</button>';
  document.getElementById("again").onclick=function(){step=0;pattern=null;sphere=null;render();window.scrollTo(0,0);};
}
render();
</script>
</body>
</html>
